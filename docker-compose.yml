services:

  # ========================
  # PostgreSQL + pgvector
  # ========================
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped

    ports:
      - "5432:5432"

    volumes:
      # PostgreSQL 18에서는 상위 디렉터리를 마운트
      - postgres_data:/var/lib/postgresql

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}


  # ========================
  # Django Backend
  # ========================
  backend:
    build: ./backend
    restart: unless-stopped

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHAT_CHECKPOINT_SIGNING_KEY: ${CHAT_CHECKPOINT_SIGNING_KEY:?Set CHAT_CHECKPOINT_SIGNING_KEY}
      CHAT_TRUST_PROXY_HEADERS: "true"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      # 챗봇을 KBO 직관 RAG 로 돌릴지. 0 이면 기존 helpful-assistant 체인 그대로 (비교 시연용)
      CHAT_USE_RAG: ${CHAT_USE_RAG:-0}
      # LangSmith 추적·평가. 키가 없으면 traceable 이 no-op 이라 오버헤드 0
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-kbo-rag}
      AUTH_FRONTEND_ORIGIN: ${AUTH_FRONTEND_ORIGIN:-http://127.0.0.1:80}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      DEMO_USERS_ENABLED: ${DEMO_USERS_ENABLED:-false}

      # Docker 내부에서는 db 서비스명으로 접근
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BASEBALL_DB_USER: ${BASEBALL_DB_USER:-}
      BASEBALL_DB_PASSWORD: ${BASEBALL_DB_PASSWORD:-}
      BASEBALL_QUERY_MAX_ROWS: ${BASEBALL_QUERY_MAX_ROWS:-200}
      BASEBALL_QUERY_TIMEOUT_MS: ${BASEBALL_QUERY_TIMEOUT_MS:-3000}
      BASEBALL_QUERY_LOCK_TIMEOUT_MS: ${BASEBALL_QUERY_LOCK_TIMEOUT_MS:-1000}
      BASEBALL_QUERY_MAX_SQL_BYTES: ${BASEBALL_QUERY_MAX_SQL_BYTES:-32768}
      BASEBALL_QUERY_MAX_RESPONSE_BYTES: ${BASEBALL_QUERY_MAX_RESPONSE_BYTES:-1048576}

    volumes:
      - ./backend:/app

      # build_index에서 읽는 전처리 CSV
      - ./data:/data:ro

      # build_index에서 읽는 JSON / md
      - ./docs:/docs:ro

    ports:
      - "8000:8000"

    depends_on:
      - db

    command: >
      sh -c "python manage.py migrate &&
             python manage.py provision_baseball_reader --prepare-db-permissions &&
             python manage.py runserver 0.0.0.0:8000"


  # ========================
  # Next.js Frontend
  # ========================
  frontend:
    build: ./frontend
    restart: unless-stopped

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    ports:
      - "3000:3000"

    depends_on:
      - backend

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      TOUR_API_KEY: ${TOUR_API_KEY:-}


  # ========================
  # Nginx
  # ========================
  nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend
      - frontend


  # ========================
  # Mailpit
  # ========================
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?Set MAILPIT_UI_AUTH for the local Mailpit web UI}

    volumes:
      - ./data/mailpit:/data


# ========================
# Named Volumes
# ========================
volumes:
  postgres_data:
