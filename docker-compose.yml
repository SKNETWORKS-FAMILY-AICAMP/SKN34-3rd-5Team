services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - ./.env

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - ./backend/.env
    environment:
      DB_HOST: db
    volumes:
      - ./backend:/app
      - ./data:/data:ro    # build_index 가 읽는 전처리 CSV
      - ./docs:/docs:ro    # build_index 가 읽는 JSON/md
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
      MP_UI_AUTH: "admin:adminpw"
    volumes:
      - ./data/mailpit:/data
    restart: unless-stopped
      
volumes:
  postgres_data:
